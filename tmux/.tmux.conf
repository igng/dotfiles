unbind C-b
set -g prefix C-s

unbind r
bind r source-file $HOME/.tmux.conf\; display "Reloaded tmux.conf"

#set -g default-shell /bin/bash
set -g default-shell /bin/zsh
set -as terminal-overrides ",gnome*:RGB"
set -g set-clipboard on

# Windows splitting
unbind v
unbind h
unbind %
unbind '"'
bind a split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Windows creation and navigation
unbind n
unbind w
bind n command-prompt "rename-window '%%'"
bind w new-window -c  "#{pane_current_path}"

set -g base-index 1
set-window-option -g pane-base-index 1

#### COLOUR (Solarized dark)

# default statusbar colors
set-option -g status-style fg=yellow,bg=black #yellow and base02

# default window title colors
set-window-option -g window-status-style fg=brightblue,bg=default #base0 and default
#set-window-option -g window-status-style dim

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bg=default #orange and default
#set-window-option -g window-status-current-style bright

# pane border
set-option -g pane-border-style fg=black #base02
set-option -g pane-active-border-style fg=brightgreen #base01

# message text
set-option -g message-style fg=brightred,bg=black #orange and base01

# pane number display
set-option -g display-panes-active-colour brightred #orange
set-option -g display-panes-colour blue #blue

# clock
set-window-option -g clock-mode-colour green #green

# mouse
set -g mouse on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

set -g status-right "#{t:window_activity}"
